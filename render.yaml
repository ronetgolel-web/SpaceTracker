services:
  - type: web
    name: spacetracker-server
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false # User needs to paste the Supabase URL in the Render dashboard
      # Add other environment variables (like API keys) manually in the Render dashboard
